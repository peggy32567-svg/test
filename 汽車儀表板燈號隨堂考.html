const ORIGINAL_CARD=`<div class="progress"><div class="bar" id="bar"></div></div><div class="meta"><span id="count"></span><span class="typepill" id="type"></span></div><div class="q" id="q"></div><div class="pic" id="pic"><span id="placeholder" style="display:none">🚘 行車安全情境題</span><img id="img"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">下一題</button>`;const $=x=>document.getElementById(x);function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}let quiz=[],i=0,score=0,lampScore=0,roadScore=0,locked=false;function start(){quiz=shuffle([...shuffle(lamps).slice(0,10),...shuffle(roads).slice(0,10)]);i=score=lampScore=roadScore=0;$('scorepill').textContent='答對 0 題';render()}function render(){locked=false;let x=quiz[i];$('bar').style.width=(i/20*100)+'%';$('count').textContent=`第 ${i+1} / 20 題`;$('type').textContent=x.type==='lamp'?'燈號辨識':'行車常識';$('q').textContent=x.q;$('feedback').innerHTML='';$('next').style.display='none';let p=$('pic'),im=$('img'),ph=$('placeholder');if(x.img){p.className='pic';im.style.display='block';im.src=x.img;if(ph)ph.style.display='none'}else{p.className='pic noimg';im.style.display='none';im.removeAttribute('src');if(ph)ph.style.display='block'}let box=$('answers');box.innerHTML='';shuffle(x.options).forEach(o=>{let b=document.createElement('button');b.className='ans';b.textContent=o;b.onclick=()=>answer(b,o,x);box.appendChild(b)})}function answer(btn,o,x){if(locked)return;locked=true;[...$('answers').children].forEach(b=>{b.disabled=true;if(b.textContent===x.answer)b.classList.add('correct')});if(o===x.answer){score++;if(x.type==='lamp')lampScore++;else roadScore++;$('feedback').innerHTML=`✅ <b>答對！</b><br>${x.explain}`}else{btn.classList.add('wrong');$('feedback').innerHTML=`❌ 正確答案：<b>${x.answer}</b><br>${x.explain}`}$('scorepill').textContent=`答對 ${score} 題`;$('next').style.display='block';$('next').textContent=i===19?'查看成績':'下一題'}$('next').onclick=()=>{i++;i<20?render():finish()};function finish(){let pct=score*5,msg=pct>=90?'很熟悉，表現很好！':pct>=75?'掌握得不錯，可以再複習幾個容易混淆的項目。':pct>=60?'已有基本概念，建議再複習警示燈與安全觀念。':'建議重新挑戰一次，先把紅色警示燈與基本行車安全觀念記熟。';$('card').innerHTML=`<div class="result"><div style="color:var(--muted)">本次測驗完成</div><div class="big">${pct}<span style="font-size:25px;color:var(--muted)"> 分</span></div><div style="font-size:20px;font-weight:800">答對 ${score} / 20 題</div><div class="split"><div class="stat">燈號辨識　<b>${lampScore}/10</b></div><div class="stat">行車常識　<b>${roadScore}/10</b></div></div><div style="color:var(--muted);margin:0 auto 25px;max-width:580px">${msg}</div><button class="restart" onclick="restartQuiz()">重新隨機出題</button></div>`}function restartQuiz(){document.getElementById('card').innerHTML=ORIGINAL_CARD;document.getElementById('next').onclick=()=>{i++;i<20?render():finish()};start();}start();
</script></body></html>
